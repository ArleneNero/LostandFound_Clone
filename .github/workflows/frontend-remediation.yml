name: Frontend remediation verification
on:
  push:
    branches: [fix/frontend-fa-fc]
permissions:
  contents: read
concurrency:
  group: frontend-remediation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked dependencies
        working-directory: apps/web
        run: npm ci --no-audit --no-fund
      - name: Prepare remediation tooling
        working-directory: apps/web
        run: npm install --save-dev --save-exact eslint@9 @eslint/js@9 typescript-eslint@8 eslint-plugin-react-hooks@5 eslint-plugin-jsx-a11y@6 globals@16 @playwright/test@1.56.1 prettier@3 --no-audit --no-fund
      - name: Run baseline verification
        working-directory: apps/web
        run: |
          npm run typecheck
          npm run lint --if-present
          npm test
          npm run build
      - name: Export verification toolchain
        if: always()
        run: |
          mkdir -p /tmp/frontend-export
          tar -czf /tmp/frontend-export/toolchain.tar.gz apps/web/node_modules apps/web/package.json apps/web/package-lock.json
          git archive --format=zip HEAD -o /tmp/frontend-export/source.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-toolchain
          path: /tmp/frontend-export
          retention-days: 3
