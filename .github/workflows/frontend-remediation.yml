name: Frontend remediation verification
on:
  push:
    branches: [fix/frontend-fa-fc]
permissions:
  contents: write
concurrency:
  group: frontend-remediation-${{ github.ref }}
  cancel-in-progress: true
env:
  PUBLISH_REMEDIATION: 'false'
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply reviewed frontend remediation
        if: hashFiles('.github/remediation/part-*.txt') != ''
        run: python .github/remediation/apply.py
      - name: Install dependencies and verify reproducible lockfile
        working-directory: apps/web
        run: |
          npm install --no-audit --no-fund
          npm ci --no-audit --no-fund
          npx prettier --write src/pages/landing/RoleCard.tsx
      - name: Apply screenshot review corrections
        if: hashFiles('.github/remediation/polish.py') != ''
        run: python .github/remediation/polish.py
      - name: Prepare evidence directory
        run: mkdir -p remediation-evidence
      - name: Lint
        id: lint
        continue-on-error: true
        working-directory: apps/web
        run: npm run lint 2>&1 | tee ../../remediation-evidence/lint.log
      - name: Typecheck
        id: types
        continue-on-error: true
        working-directory: apps/web
        run: npm run typecheck 2>&1 | tee ../../remediation-evidence/typecheck.log
      - name: Unit and component regression tests
        id: unit
        continue-on-error: true
        working-directory: apps/web
        run: npm test 2>&1 | tee ../../remediation-evidence/unit-tests.log
      - name: Production build
        id: build
        continue-on-error: true
        working-directory: apps/web
        run: npm run build 2>&1 | tee ../../remediation-evidence/build.log
      - name: Install Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Browser interaction and viewport verification
        id: browser
        continue-on-error: true
        working-directory: apps/web
        run: npm run test:e2e 2>&1 | tee ../../remediation-evidence/browser.log
      - name: Publish verified source only to authorized fix branch
        if: env.PUBLISH_REMEDIATION == 'true' && steps.lint.outcome == 'success' && steps.types.outcome == 'success' && steps.unit.outcome == 'success' && steps.build.outcome == 'success' && steps.browser.outcome == 'success'
        run: |
          test "$GITHUB_REF_NAME" = 'fix/frontend-fa-fc'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- apps/web/src apps/web/e2e apps/web/package.json apps/web/package-lock.json apps/web/vite.config.ts apps/web/playwright.config.ts apps/web/eslint.config.js apps/web/.prettierrc.json
          if [ -d .github/remediation ]; then git rm -r -- .github/remediation; fi
          if ! git diff --cached --quiet; then
            git commit -m 'fix(frontend): [F/A-F/C] perbaiki fungsi UI dan kesesuaian Figma' -m 'Perubahan: isolasi pos, foto mock asli, pagination 10, state dan aksesibilitas, design tokens, shell Petugas dan Guest. Verifikasi: lint, typecheck, unit/component tests, build, Chromium mobile dan desktop lulus. Backend tetap belum diimplementasikan.'
            git push origin HEAD:refs/heads/fix/frontend-fa-fc
          fi
      - name: Export source and quality gate outcomes
        if: always()
        env:
          LINT: ${{ steps.lint.outcome }}
          TYPES: ${{ steps.types.outcome }}
          UNIT: ${{ steps.unit.outcome }}
          BUILD: ${{ steps.build.outcome }}
          BROWSER: ${{ steps.browser.outcome }}
        run: |
          mkdir -p remediation-evidence /tmp/frontend-export
          git rev-parse HEAD > remediation-evidence/commit.txt
          python - <<'PY'
          import os, json, zipfile
          from pathlib import Path
          results = {k: os.environ[k] for k in ['LINT','TYPES','UNIT','BUILD','BROWSER']}
          Path('remediation-evidence/gates.json').write_text(json.dumps(results, indent=2))
          excluded = {'.git','node_modules','test-results','evidence','remediation-evidence','dist'}
          with zipfile.ZipFile('/tmp/frontend-export/source.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in Path('.').rglob('*'):
                  if p.is_file() and not any(part in excluded for part in p.parts) and p.suffix.lower() not in {'.woff','.woff2','.ttf','.otf'}:
                      z.write(p, p.as_posix())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-remediated-source
          path: /tmp/frontend-export/source.zip
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-browser-evidence
          path: |
            remediation-evidence
            apps/web/evidence
            apps/web/test-results
          retention-days: 7
      - name: Require every quality gate to pass
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('remediation-evidence/gates.json')
          assert p.exists(), 'Verification did not reach the reporting stage'
          gates = json.loads(p.read_text())
          print(gates)
          assert all(v == 'success' for v in gates.values()), 'One or more quality gates failed'
          PY
