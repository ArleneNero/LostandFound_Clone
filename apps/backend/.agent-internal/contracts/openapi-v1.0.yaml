components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Verified JWT session token (HS256) issued on officer login; user role and assigned service post resolved server-side from Neon PostgreSQL.
  parameters:
    PostId:
      name: post_id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    ItemId:
      name: item_id
      in: path
      required: true
      schema: &id001
        type: string
        format: uuid
    SubmissionId:
      name: submission_id
      in: path
      required: true
      schema: *id001
    UploadId:
      name: upload_id
      in: path
      required: true
      schema: *id001
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 10
        default: 10
    Q:
      name: q
      in: query
      schema:
        type: string
        maxLength: 120
    Category:
      name: category
      in: query
      schema:
        type: string
        maxLength: 80
    FilterPostId:
      name: post_id
      in: query
      schema:
        type: integer
        minimum: 1
    ItemSort:
      name: sort
      in: query
      schema:
        type: string
        enum:
        - received_at_desc
        - received_at_asc
        - item_name_asc
        description: Sort stabil; item_id sebagai tie-breaker
    SubmissionStatus:
      name: status
      in: query
      schema:
        $ref: '#/components/schemas/ReportStatus'
    ItemStatusFilter:
      name: status
      in: query
      schema:
        $ref: '#/components/schemas/ItemStatus'
  schemas:
    UserRole:
      type: string
      enum:
      - STUDENT
      - OFFICER
    ReportStatus:
      type: string
      enum:
      - PENDING_RECEIPT
      - RECEIVED
      - REJECTED
      - CANCELLED
    ItemStatus:
      type: string
      enum:
      - STORED
      - RETURNED_TO_OWNER
      - DISTRIBUTED
    ServicePostPhoto:
      type: object
      additionalProperties: false
      properties:
        photo_id: *id001
        position:
          type: integer
          minimum: 1
          maximum: 3
        is_cover:
          type: boolean
        url:
          type: string
          format: uri
        expires_at: &id002
          type: string
          format: date-time
      required:
      - photo_id
      - position
      - is_cover
      - url
      - expires_at
    ServicePostShort:
      type: object
      additionalProperties: false
      properties:
        post_id:
          type: integer
        name:
          type: string
      required:
      - post_id
      - name
    ServicePostPublic:
      type: object
      additionalProperties: false
      properties:
        post_id:
          type: integer
        name:
          type: string
        location_description:
          type: string
          nullable: true
        opening_hours:
          type: string
          nullable: true
        directions:
          type: string
          nullable: true
        photos:
          type: array
          items:
            $ref: '#/components/schemas/ServicePostPhoto'
          maxItems: 3
      required:
      - post_id
      - name
      - location_description
      - opening_hours
      - directions
      - photos
    ItemPhoto:
      type: object
      additionalProperties: false
      properties:
        photo_id: *id001
        url:
          type: string
          format: uri
        expires_at: *id002
        is_primary:
          type: boolean
      required:
      - photo_id
      - url
      - expires_at
      - is_primary
    FoundItemPublic:
      type: object
      additionalProperties: false
      properties:
        item_id: *id001
        inventory_code: &id003
          type: string
        item_name: &id004
          type: string
        category: &id005
          type: string
        public_description: &id006
          type: string
        found_location: &id007
          type: string
          nullable: true
        found_on: &id008
          type: string
          format: date
          nullable: true
