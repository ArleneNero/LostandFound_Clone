openapi: 3.0.3
info:
  title: REST API — UBL Lost and Found
  version: 1.0.0
  description: 'FINAL API contract for CampusFind (UBL Lost and Found). Domain: found items only. Phase 1: Pos Pengajaran. Authentication: Bcrypt + JWT (HS256) server-side verification against Neon PostgreSQL users table (with Neon Auth roadmap for students). App roles: STUDENT and OFFICER. Tagged with (Active - MVP) for deployed endpoints, and (Roadmap - Fase 2) for upcoming student/return workflows.'
servers:
- url: http://localhost:3000/api/v1
  description: Local Fastify development; override in deployed environments
tags:
- name: Public (Active - MVP)
  description: Endpoint publik tanpa autentikasi (Posko kampus, Katalog barang, dan Streaming foto R2)
- name: Auth & Profile (Active - MVP)
  description: Autentikasi petugas posko (Bcrypt verified) dan profil pengguna aktif (JWT HS256)
- name: Uploads R2 (Active - MVP)
  description: Two-Phase upload intent dan verifikasi berkas Cloudflare R2
- name: Officer Operations (Active - MVP)
  description: Operasi pencatatan fisik barang temuan langsung di posko oleh petugas
- name: Student (Roadmap - Fase 2 Mahasiswa)
  description: Endpoint pelaporan mandiri mahasiswa (Direncanakan pada fase pengembangan berikutnya)
- name: Officer Handover & Returns (Roadmap - Fase 2)
  description: Endpoint verifikasi fisik, penyerahan, dan pengembalian barang temuan ke pemilik sah
paths:
  /health:
    get:
      tags:
      - Public (Active - MVP)
      summary: Health check & server status
      operationId: GetServerHealth
      responses:
        '200':
          description: Server running ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  timestamp:
                    type: string
                    format: date-time
                  request_id:
                    type: string
  /auth/officer-login:
    post:
      tags:
      - Auth & Profile (Active - MVP)
      summary: Login Petugas Posko (Bcrypt verified)
      description: Verifikasi kata sandi petugas menggunakan Bcrypt dan menerbitkan JWT bertanda tangan HMAC-SHA256 (2 jam).
      operationId: OfficerLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - password
              properties:
                email:
                  type: string
                  format: email
                  example: lostandfound.budiluhur@gmail.com
                password:
                  type: string
                  example: admin321
      responses:
        '200':
          description: Login berhasil, mengembalikan token JWT dan profil petugas
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                      user:
                        $ref: '#/components/schemas/Me'
        '401':
          description: Email atau kata sandi tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: Validasi format gagal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /posts:
    get:
      tags:
      - Public (Active - MVP)
      summary: List service posts
      operationId: ListServicePosts
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Success
          content:
